# Render Blueprint: Dashboard → New → Blueprint → pick this repo.
services:
  - type: web
    name: gifpocket
    runtime: node
    # Free: sleeps after ~15 min without visitors (next visit waits ~1 min to wake),
    # 0.1 CPU and 512 MB RAM, so conversions are slower. Switch to "starter" (~$7/mo)
    # for always-on and faster GIFs, and then raise FFMPEG_JOBS / remove FFMPEG_THREADS.
    plan: free
    region: virginia
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    domains:
      - gifpocket.fun
      - www.gifpocket.fun
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: CANONICAL_HOST
        value: gifpocket.fun
      # Render's proxy puts the visitor's IP in X-Forwarded-For.
      - key: TRUST_PROXY
        value: "true"
      # Keep memory use inside the free plan's 512 MB: one conversion at a time, one thread.
      - key: FFMPEG_JOBS
        value: "1"
      - key: FFMPEG_THREADS
        value: "1"
